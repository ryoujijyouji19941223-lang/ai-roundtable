<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Roundtable</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>AI Roundtable</h1>
        <p>匿名会議・OpenAI単体 接続試験</p>
      </div>
      <div id="status" class="status">確認中…</div>
    </header>

    <section class="notice">
      会話上では <strong>Participant A / B</strong> とだけ扱います。
      Participant A には Participant B が人間だとは伝えません。
    </section>

    <section id="transcript" class="transcript" aria-live="polite">
      <div class="empty">Participant B から何か話しかけてください。</div>
    </section>

    <section class="composer">
      <textarea id="input" rows="4" placeholder="例：意味は観察する者がいなければ存在しないと思う？"></textarea>
      <div class="actions">
        <button id="send">Participant B として発言</button>
      </div>
    </section>

    <section class="debug">
      <span id="usage">Token usage: -</span>
      <span id="model">Model: -</span>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
